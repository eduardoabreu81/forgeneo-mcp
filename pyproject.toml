[project]
name = "forgeneo-mcp"
version = "0.1.0"
description = "MCP bridge between an AI agent and Stable Diffusion WebUI Forge Neo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
forgeneo-mcp = "forgeneo_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forgeneo_mcp"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keeps the suite runnable without installing the package first, regardless of
# how pytest is invoked.
pythonpath = ["."]
